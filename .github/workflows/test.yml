name: Test launcher
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Test bundled realtime shogi
        run: python -m unittest discover -s games/realtime-shogi/tests -v
      - name: Validate registered game configuration
        run: python -c "from pathlib import Path; from arcade import load_games; load_games(Path.cwd(), Path('games.json'))"
      - name: Check bundled samples (member repositories are cloned separately)
        run: python arcade.py --config .github/sample-games.json --check
