<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3273c">
<title>ゆうぐれ釣り日和｜60秒チャレンジ</title>
<link rel="stylesheet" href="fishing.css">
<link rel="stylesheet" href="cabinet.css">
</head>
<body>
<main class="game">
<!-- タイトルと、残り時間・匹数・得点を表示します。 -->
<header class="top">
<div class="brand"><span class="brand-number" aria-hidden="true">03</span><div>ゆうぐれ釣り日和<small>4PRO ARCADE · 60秒チャレンジ</small></div><span class="marquee-accent" aria-hidden="true"><svg viewBox="0 0 32 32"><g stroke="#ffd449" stroke-width="2"><path d="M16 0v4m0 24v4M0 16h4m24 0h4M5 5l3 3m16 16 3 3M5 27l3-3M24 8l3-3"/></g><circle cx="16" cy="16" r="8" fill="#ffd449"/></svg><i></i><i></i></span>
</div>
<div class="stats">
<div id="timer" class="pill timer">⏱ <span>60</span> 秒</div>
<div class="pill">🐟 <span id="score">0</span> 匹</div>
<div class="pill">⭐ <span id="points">0</span> pt</div>
</div>
</header>
<!-- ゲームの舞台。背景、釣り人、ウキ、結果表示を重ねます。 -->
<section class="scene" aria-label="夕暮れの釣り場">
<div class="sun"></div>
<div class="cloud"></div>
<div class="hill"></div>
<div class="hill two"></div>
<div class="waterline"></div>
<div class="ripples"></div>
<div class="angler"><svg viewBox="0 0 180 180" aria-hidden="true"><path d="M35 166 131 10" fill="none" stroke="#303e37" stroke-width="5"/><path d="M48 145 131 10" fill="none" stroke="#e9b551" stroke-width="2"/><path d="m31 169 27-44" stroke="#70472d" stroke-width="10" stroke-linecap="round"/><circle cx="47" cy="147" r="15" fill="#b7834c" stroke="#473a2f" stroke-width="3"/><circle cx="47" cy="147" r="7" fill="#e5bd7c"/><path d="m47 147 17 9 8-7" fill="none" stroke="#4d4132" stroke-width="4" stroke-linecap="round"/></svg></div>
<svg class="fishing-line" aria-hidden="true"><line/></svg>
<div id="bobber" class="bobber" role="img" aria-label="ウキ">
<span class="bobber-body"></span>
</div>
<div id="bite" class="bite">
<span>HIT！ バーに注目！</span>
</div>
<section id="timingMeter" class="timing-meter" aria-label="釣りのタイミングバー" hidden>
<div class="timing-heading"><strong id="timingName"></strong><span id="timingTime"></span></div>
<div class="timing-track" aria-hidden="true"><div id="targetZone" class="target-zone"></div><div id="needle" class="timing-needle"></div></div>
<div id="timingCaption" class="timing-caption">黄色のエリアで <kbd>Enter</kbd> ／ 合わせる</div>
<div id="recastProgress" class="recast-progress" aria-hidden="true" hidden><i></i></div>
</section>
<div id="catchArt" class="catch-art" aria-live="polite"></div>
<div id="overlay" class="overlay">
<div class="overlay-card">
<h2 id="overlayTitle">60秒チャレンジ</h2>
<p id="overlayText"><span class="intro-lead">60秒で、何匹釣れる？</span><span class="intro-step"><b>1</b> スタートで自動で投げる</span><span class="intro-step"><b>2</b> 魚がかかったらバーに注目！</span><span class="intro-step"><b>3</b> 黄色のエリアで <kbd>Enter</kbd></span><span class="intro-note">難しい魚ほど成功エリアがせまくなるよ。<br>5秒以内に決めよう。次の投げ直しは自動！</span></p>
<button id="start">釣りを始める</button>
</div>
</div>
<div class="dock"></div>
</section>
<!-- 状況メッセージと、投げる／合わせる操作です。 -->
<section class="bottom">
<div>
<span class="auto-mode">自動で投げ直し</span>
<div id="message" class="message">準備ができたらチャレンジ開始！</div>
<div id="hint" class="hint">投げるのは自動 ／ 黄色のエリアでEnter</div>
</div>
<div class="buttons">
<button id="cast" class="cast" disabled>🎣 <span id="castLabel">投げるのは自動</span> <span class="key">Space</span>
</button>
<button id="hook" class="hook" disabled>🐟 合わせる <span class="key">Enter</span>
</button>
</div>
</section>
<!-- 釣った魚が分かるコレクションです。 -->
<footer class="collection">
<strong>🐠 今日の釣果</strong>
<span class="fish-chip" data-fish="アジ">？ アジ</span>
<span class="fish-chip" data-fish="タイ">？ タイ</span>
<span class="fish-chip" data-fish="サバ">？ サバ</span>
<span class="fish-chip" data-fish="カレイ">？ カレイ</span>
<span class="fish-chip" data-fish="キンメダイ">？ キンメダイ</span>
</footer>
</main>
<script src="fishing.js" defer></script>
</body>
</html>
