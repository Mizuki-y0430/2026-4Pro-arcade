name: Test launcher
on: [push, pull_request]
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bundled Kosen Survivor
        run: node --test tests/test_kosen_game.cjs
      - run: python -m unittest discover -s tests -v
      - name: Test bundled realtime shogi
        run: python -m unittest discover -s games/realtime-shogi/tests -v
      - name: Validate registered game configuration
        run: python -c "from pathlib import Path; from arcade import load_games; load_games(Path.cwd(), Path('games.json'))"
      - name: Install bundled game dependencies
        run: python -m pip install -r requirements/arcade-web.txt
      - name: Check all six bundled games
        run: python setup_arcade.py --check
      - name: Test bundled chess
        run: python -m unittest discover -s games/local/chess/tests -v
      - name: Test bundled mole game
        run: python -m unittest discover -s games/local/tesuto/tests -v
      - name: Check bundled samples
        run: python arcade.py --config .github/sample-games.json --check
