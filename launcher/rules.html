<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="/style.css">

  <script src="/guide-navigation.js" defer></script>
</head>
<body class="rules-page">
  <div class="rules-shell">
    <nav class="rules-nav" aria-label="ページ移動"><a class="rules-back" href="/">← ゲーム一覧</a><span>4PRO ARCADE</span></nav>
    <main id="rules-main" aria-busy="true">
      <div class="rules-heading"><span class="rules-emblem" aria-hidden="true">遊び方</span><div><p class="rules-kicker">ルールと操作方法</p><h1 id="rules-title">読み込み中…</h1></div></div>
      <p class="rules-summary" id="rules-summary"></p>
      <figure class="guide-poster" id="guide-poster" hidden>
        <a id="guide-poster-link" target="_blank" rel="noopener"><img id="guide-poster-image" alt="" decoding="async"></a>
        <figcaption>画像を押すと別タブで拡大できます。文章での説明は「詳しいルール」から確認できます。</figcaption>
      </figure>
      <div class="rules-sections" id="rules-sections" hidden>
        <section class="rules-card goal-card" aria-labelledby="goal-heading"><h2 id="goal-heading"><span>01</span> めざすこと</h2><div class="goal-body"><div id="goal-diagram"></div><div><h3 id="goal-title"></h3><p id="goal-copy"></p></div></div></section>
