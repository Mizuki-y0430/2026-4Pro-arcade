<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b71929">
<title>ゆうぐれ釣り日和｜60秒チャレンジ</title>
<link rel="stylesheet" href="fishing.css">
</head>
<body>
<main class="game">
<!-- タイトルと、残り時間・匹数・得点を表示します。 -->
<header class="top">
<div class="brand"><span class="brand-number" aria-hidden="true">03</span><div>ゆうぐれ釣り日和<small>4PRO ARCADE · 60秒チャレンジ</small></div>
</div>
<div class="stats">
<div id="timer" class="pill timer">⏱ <span>60</span> 秒</div>
<div class="pill">🐟 <span id="score">0</span> 匹</div>
<div class="pill">⭐ <span id="points">0</span> pt</div>
</div>
</header>
<!-- ゲームの舞台。背景、釣り人、ウキ、結果表示を重ねます。 -->
<section class="scene" aria-label="夕暮れの釣り場">
<div class="sun"></div>
<div class="cloud"></div>
<div class="hill"></div>
<div class="hill two"></div>
<div class="waterline"></div>
<div class="ripples"></div>
<div class="angler">🎣</div>
<div id="bobber" class="bobber" role="img" aria-label="ウキ">
<span class="bobber-body"></span>
</div>
<div id="bite" class="bite">
<span>HIT！ タイミングよく合わせて！</span>
</div>
<div id="catchArt" class="catch-art" aria-live="polite"></div>
<div id="overlay" class="overlay">
<div class="overlay-card">
<h2 id="overlayTitle">60秒チャレンジ</h2>
<p id="overlayText">制限時間内に、できるだけたくさん釣ろう！<br>
<span class="key">Space</span> で投げる　 <span class="key">Enter</span> で合わせる</p>
<button id="start">釣りを始める</button>
</div>
</div>
<div class="dock"></div>
</section>
<!-- 状況メッセージと、投げる／合わせる操作です。 -->
<section class="bottom">
<div>
<div id="message" class="message">準備ができたらチャレンジ開始！</div>
<div id="hint" class="hint">投げる：Space ／ 魚がかかったら合わせる：Enter</div>
</div>
<div class="buttons">
<button id="cast" class="cast" disabled>🎣 投げる <span class="key">Space</span>
</button>
<button id="hook" class="hook" disabled>🐟 合わせる <span class="key">Enter</span>
</button>
</div>
</section>
<!-- 釣った魚が分かるコレクションです。 -->
<footer class="collection">
<strong>🐠 今日の釣果</strong>
<span class="fish-chip" data-fish="アジ">？ アジ</span>
<span class="fish-chip" data-fish="タイ">？ タイ</span>
<span class="fish-chip" data-fish="サバ">？ サバ</span>
<span class="fish-chip" data-fish="カレイ">？ カレイ</span>
<span class="fish-chip" data-fish="キンメダイ">？ キンメダイ</span>
</footer>
</main>
<script src="fishing.js" defer></script>
</body>
</html>
