<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>4Pro Arcade</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/menu.css">
  <script src="/app.js" defer></script>
</head>
<body class="arcade-home">
  <div class="shell menu-console">
    <header class="menu-header">
      <h1 class="menu-logo"><a href="/" aria-label="4Pro Arcade ホーム"><img class="menu-logo-image" src="/assets/4PROARCADE_logo.png" alt="4PRO ARCADE" width="2172" height="724" fetchpriority="high"></a></h1>
      <p class="menu-instruction">どれであそぶ？</p>
    </header>
    <main>
      <section class="library" aria-labelledby="library-title">
        <h2 class="sr-only" id="library-title">ゲームを選ぶ</h2>
        <div class="menu-toolbar">
          <span id="count" class="ready-count" aria-live="polite">読み込み中…</span>
          <div class="menu-actions">
            <div class="filters" aria-label="ゲームの種類">
              <button class="selected" data-filter="all" aria-pressed="true">すべて</button>
              <button data-filter="web" aria-pressed="false">Web</button>
              <button data-filter="python" aria-pressed="false">Python</button>
            </div>
            <button id="home-fullscreen" class="menu-nav-button menu-fullscreen" aria-pressed="false" hidden>⛶ 全画面</button>
          </div>
        </div>
        <div class="grid arcade-grid" id="games" aria-live="polite"></div>
        <p class="empty-filter" id="empty-filter" hidden>この種類のゲームはまだありません。</p>
      </section>
    </main>
    <footer class="menu-nav">
      <button class="menu-nav-button nav-exit" id="exit">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M13 9h37v46H13Z" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round"/><path d="m18 16 27-4v40l-27-7Z" fill="#ee3544" stroke="#000" stroke-width="3"/><circle cx="38" cy="34" r="3" fill="#fff"/><path d="M5 30h21m-7-7 7 7-7 7" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>終了</span>
      </button>
    </footer>
  </div>
  <dialog id="guide" class="guide-dialog" aria-label="ゲームの説明"><iframe id="guide-frame" title="ゲームの説明" sandbox="allow-scripts allow-same-origin"></iframe></dialog>
  <dialog id="player" class="player"><div class="player-top"><button id="back" class="back">← ゲーム一覧</button><div><strong id="player-title"></strong><span id="player-controls"></span></div><button id="fullscreen" class="quiet">全画面 ⛶</button></div><div class="play-area" id="play-area"><iframe id="game-frame" title="ゲーム" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-downloads" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe></div></dialog>
  <dialog id="exit-dialog" class="help-dialog"><h2>アーケードを終了しますか？</h2><p>起動中のゲームもすべて終了します。</p><div class="dialog-actions"><button id="exit-cancel" class="quiet">戻る</button><button id="exit-confirm" class="primary">終了する</button></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
